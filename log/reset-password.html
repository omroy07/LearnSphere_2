<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Set a new password for your LearnSphere account.">
    <title>Reset Password – LearnSphere</title>
    <link rel="stylesheet" href="../variables.css">
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="login.css">
</head>
<body class="auth-page">

    <a class="auth-skip" href="#auth-main">Skip to form</a>
    <header class="auth-top-bar">
        <a class="auth-brand" href="../index.html">LearnSphere</a>
        <button type="button" id="themeToggleBtn" class="auth-theme-btn" aria-label="Toggle theme"></button>
    </header>

    <main id="auth-main" class="auth-main" role="main">
        <div class="auth-container" role="region" aria-labelledby="reset-heading">
            <h2 id="reset-heading">Reset Password</h2>
            <p class="auth-subtitle">Enter your new password below.</p>

            <div id="auth-message" role="alert" aria-live="polite" aria-atomic="true"></div>

            <form id="resetPasswordForm" novalidate>
                <input type="hidden" id="resetToken" name="token">

                <div class="form-group">
                    <label for="password">New Password</label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter new password (min. 6 characters)"
                            required
                            autocomplete="new-password"
                            minlength="6"
                            aria-required="true"
                        >
                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Show password"
                            aria-pressed="false"
                        >👁</button>
                    </div>
                </div>

                <button type="submit" class="auth-button" id="resetSubmitBtn">
                    Reset Password
                </button>

                <p class="switch-auth">
                    <a href="login.html">Back to login</a>
                </p>
            </form>
        </div>
    </main>

    <script src="../authConfig.js"></script>
    <script src="../authApi.js"></script>
    <script src="login.js"></script>
    <script>
        const toggleBtn = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("password");

        toggleBtn.addEventListener("click", () => {
            const isVisible = passwordInput.type === "text";
            passwordInput.type = isVisible ? "password" : "text";
            toggleBtn.setAttribute("aria-pressed", (!isVisible).toString());
            toggleBtn.setAttribute("aria-label", isVisible ? "Show password" : "Hide password");
        });
    </script>
</body>
</html>
