<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your LearnSphere account password.">
    <title>Forgot Password – LearnSphere</title>
    <link rel="stylesheet" href="../variables.css">
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="login.css">
</head>
<body class="auth-page">

    <a class="auth-skip" href="#auth-main">Skip to form</a>
    <header class="auth-top-bar">
        <a class="auth-brand" href="../index.html">LearnSphere</a>
        <button type="button" id="themeToggleBtn" class="auth-theme-btn" aria-label="Toggle theme"></button>
    </header>

    <main id="auth-main" class="auth-main" role="main">
        <div class="auth-container" role="region" aria-labelledby="forgot-heading">
            <h2 id="forgot-heading">Forgot Password</h2>
            <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>

            <div id="auth-message" role="alert" aria-live="polite" aria-atomic="true"></div>

            <form id="forgotPasswordForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                        aria-required="true"
                    >
                </div>

                <button type="submit" class="auth-button" id="forgotSubmitBtn">
                    Send Reset Link
                </button>

                <p class="switch-auth">
                    Remember your password?
                    <a href="login.html">Back to login</a>
                </p>
            </form>
        </div>
    </main>

    <script src="../authConfig.js"></script>
    <script src="../authApi.js"></script>
    <script src="login.js"></script>
</body>
</html>
